# Dependency alerting.
#
# "npm audit: zero advisories" is a snapshot taken on the day someone runs it.
# Next has shipped multiple coordinated multi-CVE releases in recent months and
# now pre-announces them, so a project with no alerting learns about the next
# one whenever a human next remembers to look. This closes that gap: weekly
# checks, plus immediate security PRs from GitHub's advisory database.
#
# Grouping keeps the noise survivable for a solo maintainer — one PR a week for
# routine bumps, while security updates still arrive on their own as they land.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # The workflow in ci.yml pins third-party actions by major version, so a
  # compromised or abandoned action is a supply-chain path into CI that npm
  # alerting cannot see. Monthly rather than weekly: this list is three actions
  # long and moves slowly, and security advisories still arrive immediately
  # regardless of the interval.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
